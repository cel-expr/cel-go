- test:
    name: "struct_name_not_a_string"
    types:
      - struct:
          name:
            - "bad_name"
    error: |-
      Type definition 'name' is not a string
      |            - "bad_name"
      |            ^

- test:
    name: "unsupported_type_def_kind"
    types:
      - union:
          name: "Item"
    error: |-
      Type definition must specify 'struct' or 'enum'
      |      - union:
      |        ^

- test:
    name: "struct_cannot_have_constants"
    types:
      - struct:
          name: "Item"
          constants: []
    error: |-
      Struct type definition cannot have 'constants'
      |          constants: []
      |          ^

- test:
    name: "enum_cannot_have_fields"
    types:
      - enum:
          name: "Status"
          fields: []
    error: |-
      Enum type definition cannot have 'fields'
      |          fields: []
      |          ^

- test:
    name: "empty_field_type_signature"
    types:
      - struct:
          name: "Item"
          fields:
            - name: "f"
              type: ""
    error: |-
      Empty type signature
      |              type: ""
      |                    ^

- test:
    name: "structured_type_missing_type_name"
    types:
      - struct:
          name: "Item"
          fields:
            - name: "f"
              type: {}
    error: |-
      Node 'type_name' is not specified
      |              type: {}
      |                    ^

- test:
    name: "negative_uint_default_constant"
    types:
      - struct:
          name: "Item"
          fields:
            - name: "f"
              type: "uint"
              default: -1
    error: |-
      Failed to parse uint constant
      |              default: -1
      |                       ^

- test:
    name: "duplicate_struct_field_name"
    types:
      - struct:
          name: "Item"
          fields:
            - name: "f"
              type: "string"
            - name: "f"
              type: "int"
    error: |-
      Field 'f' is already defined.
      |            - name: "f"
      |                    ^
    go_error: |-
      already exists: field "f"
      |            - name: "f"
      |                    ^

- test:
    name: "enum_constant_id_not_an_integer"
    types:
      - enum:
          name: "Status"
          constants:
            - name: "ACTIVE"
              id: "not_an_int"
    error: |-
      Node 'id' is not an integer
      |              id: "not_an_int"
      |                  ^

- test:
    name: "duplicate_enum_constant_name"
    types:
      - enum:
          name: "Status"
          constants:
            - name: "ACTIVE"
            - name: "ACTIVE"
    error: |-
      Enum constant 'ACTIVE' is already defined.
      |            - name: "ACTIVE"
      |                    ^
    go_error: |-
      already exists: enum constant "ACTIVE"
      |            - name: "ACTIVE"
      |                    ^

