name: agent_tool_execution_governance
variables:
  - name: "request.is_emergency"
    type_name: "bool"
  - name: "request.env"
    type_name: "string"
  - name: "tool.is_mutation"
    type_name: "bool"
  - name: "tool.call.args"
    type_name: "map"
    params:
      - type_name: "string"
      - type_name: "dyn"
functions:
  - name: "hasCreditCard"
    overloads:
      - id: "hasCreditCard"
        args:
          - type_name: "dyn"
        return:
          type_name: "bool"
  - name: "hasEmailOrPhone"
    overloads:
      - id: "hasEmailOrPhone"
        args:
          - type_name: "dyn"
        return:
          type_name: "bool"
